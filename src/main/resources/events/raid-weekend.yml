id: raid-weekend
type: RAID
enabled: true
priority: 10
duration: 1h
bossbar:
  enabled: true
  title: '&#FFB86BRAID FIN DE SEMANA &8│ &f{remaining}'
  color: YELLOW
  overlay: PROGRESS
breaking:
  enabled: true
  mode: WHITELIST
  blocks:
  - STONE
  - COBBLESTONE
  - OAK_PLANKS
  - GLASS
  drop-items: true
  hit-cooldown-millis: 250
  block-hit-expiration: 30s
  feedback:
    actionbar: true
    sound: BLOCK_STONE_HIT
crystals:
  stealable: false
  steal-mode: GUI
  confirmation: true
  remove-after-steal: true
  drop-to-attacker: true
forced-flags:
  block-break:
    state: ALLOW
    audience: NON_MEMBERS
  block-place:
    state: DENY
    audience: NON_MEMBERS
  interact:
    state: DENY
    audience: NON_MEMBERS
  use:
    state: DENY
    audience: NON_MEMBERS
  chest-access:
    state: ALLOW
    audience: NON_MEMBERS
  damage-animals:
    state: ALLOW
    audience: NON_MEMBERS
  damage-mobs:
    state: ALLOW
    audience: NON_MEMBERS
  damage-villagers:
    state: DENY
    audience: NON_MEMBERS
  pvp:
    state: ALLOW
    audience: NON_MEMBERS
  tnt:
    state: DENY
    audience: NON_MEMBERS
  lighter:
    state: DENY
    audience: NON_MEMBERS
messages:
  prefix: '&8[&cRaid&8] '
  started:
  - '{prefix}&c¡Ha comenzado el RAID!'
  - '&7Las reglas cambian temporalmente; los escudos conservan la protección.'
  ended:
  - '{prefix}&aEl RAID ha finalizado.'
  - '&7Las protecciones han vuelto a la normalidad.'
feedback:
  started:
    title: '&#FF5555¡RAID INICIADO!'
    subtitle: '&7Duración: {duration}'
    sound: EVENT_RAID_HORN
  ended:
    actionbar: '&aTu ciudad conserva sus reglas originales.'
    sound: BLOCK_BEACON_DEACTIVATE
